<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>PedePizza</title>
</head>
<body>
    <main>
       
        
        <form class="formulario" action="#" method="post">
            <div class="div-imagem">
            <img src="/image/pizzaiolo.png" alt="Pizzaiolo">
        </div>
            <h2 class="h2-main">PedePizza</h2>
            <p class="p-title">Faça seu pedido: </p>

        <div class="linha">
            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" name="nome" id="nome" required><br><br>
            </div>

            <div class="campo">
                <label for="sobrenome">Sobrenome:</label>
                <input type="text" name="sobrenome" id="sobrenome" required><br><br>
            </div>
        

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email" required><br><br>
            </div>

            <div class="campo">
                <label for="endereco">Endereço:</label>
                <input type="text" name="endereco" id="endereco" required><br><br>
            </div>

            <fieldset class="divTamanho">
                    <legend>Tamanho da pizza:</legend>

                <input type="radio" name="tamanho" id="pequena" value="pequena">
                <label for="pequena">Pequena</label>
                
                <input type="radio" name="tamanho" id="media" value="media"> 
                <label for="media">Média</label>

                <input type="radio" name="tamanho" id="grande" value="grande">
                <label for="grande">Grande</label><br><br>
            </fieldset>

            <div class="campo">
                <label for="sabores">Sabores:</label>
                <select name="sabores" id="sabores">
                    <option value="margherita">Margherita</option>
                    <option value="pepperoni">Pepperoni</option>
                    <option value="calabresa">Calabresa</option>
                </select> <br><br>
            </div>

            <fieldset class="opcoes">
                <legend>Método de pagamento:</legend>
                <br>

                <input type="radio" name="pagamento" id="Crédito"
                value="Crédito">
                <label for="Crédito">Crédito</label>
                <input type="radio" name="pagamento" id="Débito"
                value="Débito">
                <label for="Débito">Débito</label>
                <input type="radio" name="pagamento" id="Dinheiro"
                value="Dinheiro">
                <label for="Dinheiro">Dinheiro</label>
                <input type="radio" name="pagamento" id="Pix"
                value="Pix">
                <label for="Pix">Pix</label><br><br>
            </fieldset>

            <div class="campo">
                <label for="observações">Observações:</label>
                <textarea name="observações" id="observações" cols="30" rows="10"></textarea><br><br>
            </div>

            <button type="submit">Fazer pedido</button>

        </div>   

        
    </main>
</body>
</html>
